dependencies {
    implementation project(':common')

    implementation 'space.arim.morepaperlib:morepaperlib:0.4.4'
    implementation 'net.kyori:adventure-platform-bukkit:4.4.1'
    implementation 'net.william278.toilet:toilet-bukkit:1.1.2'

    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'net.william278:desertwell:2.0.8'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'me.clip:placeholderapi:2.12.2'
    compileOnly('net.essentialsx:EssentialsX:2.21.1') {
        exclude group: 'org.spigotmc', module: 'spigot-api'
    }
    compileOnly 'org.projectlombok:lombok:1.18.42'

    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

java {
    toolchain {
        languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(25)
    }
}
