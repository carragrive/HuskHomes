# Builds, tests, and publishes snapshot or release artifacts.
name: Build & Publish

on:
  workflow_call:
    inputs:
      release:
        description: 'Whether to publish a release instead of an alpha snapshot'
        required: true
        type: boolean
      version:
        description: 'Release version; snapshot versions are resolved from Gradle'
        required: false
        type: string
        default: ''
      changelog:
        description: 'Changelog supplied to distribution platforms'
        required: true
        type: string
    secrets:
      BONES_API_KEY:
        required: true
      MODRINTH_TOKEN:
        required: true
      HANGAR_API_KEY:
        required: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository 🛠️'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 'Set up JDK 25 📦'
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: 'Set up Gradle 📦'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: 'Build with Gradle 🏗️'
        id: build
        run: ./gradlew clean build --build-cache
      - name: 'Publish Test Report 📊'
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
      - name: 'Resolve Version Name 📝'
        id: version
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          IS_RELEASE: ${{ inputs.release }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            version="$RELEASE_VERSION"
            version_type="release"
          else
            version="$(./gradlew properties --no-daemon --console=plain -q | awk '/^version:/ { print $2; exit }')"
            version_type="alpha"
          fi
          if [[ -z "$version" ]]; then
            echo "Unable to resolve the publish version" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "type=$version_type" >> "$GITHUB_OUTPUT"
      - name: 'Publish to William278.net 🚀'
        uses: WiIIiam278/bones-publish-action@v1
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          api-key: ${{ secrets.BONES_API_KEY }}
          project: 'huskhomes'
          channel: ${{ steps.version.outputs.type }}
          version: ${{ steps.version.outputs.name }}
          changelog: ${{ inputs.changelog }}
          distro-names: paper
          distro-groups: paper
          distro-descriptions: Paper
          files: target/HuskHomes-Paper-${{ steps.version.outputs.name }}.jar
      - name: 'Paper: Publish to Modrinth & Hangar 🚰'
        uses: WiIIiam278/mc-publish@hangar
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          modrinth-id: J6U9o3JG
          modrinth-featured: false
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-dependencies: |
            dynmap | suggests | *
            bluemap | suggests | *
            pl3xmap | suggests | *
            plan | suggests | *
          hangar-id: William278/HuskHomes
          hangar-token: ${{ secrets.HANGAR_API_KEY }}
          hangar-version-type: ${{ steps.version.outputs.type }}
          files-primary: target/HuskHomes-Paper-${{ steps.version.outputs.name }}.jar
          name: HuskHomes (Paper) v${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.name }}
          version-type: ${{ steps.version.outputs.type }}
          changelog: ${{ inputs.changelog }}
          loaders: |
            paper
          game-versions: |
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.4
            1.21.5
            1.21.6
            1.21.8
            1.21.11
            26.1.1
            26.1.2
            26.2
          java: 17
