# Carry out tests on pull requests
name: PR Tests

on:
  pull_request:
    branches: [ 'master' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 'Checkout for CI 🛎'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 'Set up JDK 25 📦'
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: 'Set up Gradle 📦'
        uses: gradle/actions/setup-gradle@v6.3.0
      - name: 'Build with Gradle 🏗️'
        run: ./gradlew build --build-cache
      - name: 'Get Short Commit ID 📝'
        id: commit
        run: echo "short_id=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: 'Prepare Unverified PR Build Artifacts 📦'
        env:
          ARTIFACT_TAG: PR-${{ github.event.pull_request.number }}-${{ steps.commit.outputs.short_id }}
        run: |
          mv target/HuskHomesX-Paper-*.jar "target/UNVERIFIED-HuskHomesX-Paper-${ARTIFACT_TAG}.jar"
      - name: 'Upload Unverified Paper PR Build Artifact 📤'
        uses: actions/upload-artifact@v7.0.1
        with:
          path: target/UNVERIFIED-HuskHomesX-Paper-PR-${{ github.event.pull_request.number }}-${{ steps.commit.outputs.short_id }}.jar
          if-no-files-found: error
          retention-days: 7
          archive: false
      - name: 'Publish Test Report 📊'
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
